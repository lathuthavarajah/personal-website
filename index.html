<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lathu@waterloo ~ $</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <span class="titlebar-text">lathu@waterloo — zsh — 80×24</span>
    </div>
    <div class="terminal" id="terminal">
      <div id="output"></div>
      <div class="input-line" id="inputLine">
        <span class="prompt"><span class="user">lathu</span>@<span class="host">waterloo</span> <span class="dir">~</span> <span class="dollar">$</span></span>
        <input type="text" id="cmdInput" autofocus autocomplete="off" autocapitalize="off" spellcheck="false" />
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
